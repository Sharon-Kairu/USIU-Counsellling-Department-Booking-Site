<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login| Usiu Africa Counselling Department</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
    
        const firebaseConfig = {
            apiKey: "AIzaSyB7d1qB8MrB4eBv9GJt-s_p6gZqKm05WHY",
            authDomain: "usiu-counselling-app.firebaseapp.com",
            projectId: "usiu-counselling-app",
            storageBucket: "usiu-counselling-app.appspot.com",
            messagingSenderId: "1013701067761",
            appId: "1:1013701067761:web:671c41ea82cdc8f2f43a50",
            measurementId: "G-5J0EJVH1SD"
        };
    
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); // Firestore should be initialized here
    
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('login-form').addEventListener('submit', async function (event) {
                event.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
    
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    const token = await user.getIdToken();
    
                    const response = await fetch('/verify_token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ token: token })
                    });
    
                    if (response.ok) {
                const result = await response.json(); // Parse the JSON response
                const role = result.role; // Get the role from the response

                // Redirect based on the role
                if (role === 'client') {
                    window.location.href = "/client";
                } else if (role === 'counsellor') {
                    window.location.href = "/counsellor";
                } else if(role=='admin') {
                    window.location.href = "/admin";
                }
            } else {
                
                document.getElementById('error-message').textContent = 'Login failed. Please try again.';
            }
                } catch (error) {
                    document.getElementById('error-message').textContent = error.message;
                }
            });
        });
    </script>
    

</head>
<header>
    <img src="{{ url_for('static', filename='USIU Logo.png') }}" alt="Usiu Logo" id="logo">
    <h2 class ="yellowtext "id="header">USIU COUNSELLING DEPARTMENT</h2>

</header>

<body>
    
   <main>

        <div class="login-section">
            <div class="login-box">   
                <img src="{{ url_for('static', filename='counsel2.jpg') }}" id="counsell">

                <div class="welcome">
                    <h1 class="yellowtext">Welcome Back!</h1>
                    <p>Login to book your sessions with us</p>
                    <p>Don't have an account?</p>
                    <p class="yellowtext"><a href="/signup">Sign up here</a></p>
                </div>
            </div>

            <div id="formsection">
                <h2 class="bluetext">LOGIN</h2>
                <br>
                <br>
                
                <form id="login-form">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <br/>

                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                    <br/>

                    <button type="submit" id="loginBt">Login</button>
                </form>
                <p id="error-message" class="error-message"></p>
               
            </div>
        </div>
    </div>
    </main>

   
</body>
</html>
